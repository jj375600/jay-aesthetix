# Optional: run Postgres locally with `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jay
      POSTGRES_PASSWORD: jay
      POSTGRES_DB: jay_aesthetix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
